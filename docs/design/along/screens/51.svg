<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>51 · Cancel entire group</title><defs><clipPath id="clip1"><rect x="0" y="0" width="390" height="844" rx="32"/></clipPath></defs><g clip-path="url(#clip1)"><rect x="0" y="0" width="390" height="844" rx="32" fill="rgb(247,248,242)" stroke="none" stroke-width="1" opacity="1"/><text x="24" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">9:41</text><text x="300.6600036621094" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">▮▮▮  5G  ▰</text><rect x="135" y="827" width="120" height="4" rx="2" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><rect x="24" y="60" width="44" height="44" rx="16" fill="rgb(255,255,255)" stroke="none" stroke-width="1" opacity="1"/><svg x="35" y="71" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg><text x="80" y="87.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Cancel group</text><rect x="24" y="127" width="64" height="64" rx="16" fill="rgb(255,240,236)" stroke="none" stroke-width="1" opacity="1"/><svg x="45" y="148" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AD3E36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 18H2Z"/><path d="M12 9v5m0 3v1"/></svg><text x="24" y="232.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Close the group for</text><text x="24" y="262.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">everyone?</text><text x="24" y="303.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">As coordinator, you can cancel this group. All active</text><text x="24" y="325.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">requests in it will be cancelled.</text><rect x="24" y="349" width="342" height="78" rx="12" fill="rgb(255,240,236)" stroke="none" stroke-width="1" opacity="1"/><text x="36" y="374.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(173,62,54)">Nobody can join or send messages after cancellation.</text><text x="36" y="392.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(173,62,54)">Authorized members retain read-only history for up to one</text><text x="36" y="410.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(173,62,54)">hour.</text><rect x="24" y="679" width="342" height="52" rx="16" fill="rgb(173,62,54)" stroke="none" stroke-width="1" opacity="1"/><text x="99.9749984741211" y="710.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(255,255,255)">Cancel group for everyone</text><text x="131.23500061035156" y="772.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Keep group ready</text></g></svg>