<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>43 · Block and leave</title><defs><clipPath id="clip1"><rect x="0" y="0" width="390" height="844" rx="32"/></clipPath></defs><g clip-path="url(#clip1)"><rect x="0" y="0" width="390" height="844" rx="32" fill="rgb(247,248,242)" stroke="none" stroke-width="1" opacity="1"/><text x="24" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">9:41</text><text x="300.6600036621094" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">▮▮▮  5G  ▰</text><rect x="135" y="827" width="120" height="4" rx="2" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><rect x="24" y="60" width="44" height="44" rx="16" fill="rgb(255,255,255)" stroke="none" stroke-width="1" opacity="1"/><svg x="35" y="71" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg><text x="80" y="87.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Block Rider A</text><rect x="24" y="127" width="64" height="64" rx="16" fill="rgb(255,240,236)" stroke="none" stroke-width="1" opacity="1"/><svg x="45" y="148" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AD3E36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg><text x="24" y="232.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Block and leave this group?</text><text x="24" y="273.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">You won’t be paired with this rider while signed in.</text><rect x="24" y="297" width="342" height="78" rx="12" fill="rgb(255,240,236)" stroke="none" stroke-width="1" opacity="1"/><text x="36" y="322.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(173,62,54)">Because you share a group, blocking also removes you</text><text x="36" y="340.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(173,62,54)">from it and cancels your request. Your access to private</text><text x="36" y="358.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(173,62,54)">chat ends immediately.</text><text x="24" y="409.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Other members stay in the group. The normal</text><text x="24" y="431.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">leave and coordinator rules still apply.</text><text x="136.6599998474121" y="486.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Report this rider</text><rect x="24" y="679" width="342" height="52" rx="16" fill="rgb(173,62,54)" stroke="none" stroke-width="1" opacity="1"/><text x="138.30500030517578" y="710.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(255,255,255)">Block and leave</text><text x="165.4050006866455" y="772.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Go back</text></g></svg>