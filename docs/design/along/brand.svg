<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900"><title>cover</title><rect x="0" y="0" width="1560" height="900" rx="0" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><rect x="56" y="55" width="72" height="72" rx="16" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><svg x="56" y="55" width="100" height="100" viewBox="0 0 72 72" fill="none"><path d="M20 52V38c0-11 16-9 16-20m16 34V38c0-11-16-9-16-20m-8 8 8-8 8 8" stroke="#DDF5A0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="146" y="98.8" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="rgb(255,255,255)">along</text><text x="56" y="194.8" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="rgb(255,255,255)">Good company.</text><text x="56" y="248.8" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="rgb(255,255,255)">Same direction.</text><text x="56" y="301.3" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="rgb(221,245,160)">A map-first way to find nearby people, meet at one place, and share a</text><text x="56" y="325.3" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="rgb(221,245,160)">taxi.</text><text x="56" y="368.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(255,255,255)">MOBILE MVP / DESIGN CONCEPT / 03 OCT 2026</text><text x="56" y="413.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(255,255,255)">Start on page 01, screen 01. Primary buttons connect the demo journey.</text><text x="56" y="435.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(255,255,255)">Page 02 covers recovery, safety and settings.</text><rect x="860" y="56" width="640" height="466" rx="24" fill="rgb(255,255,255)" stroke="none" stroke-width="1" opacity="1"/><text x="884" y="103.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Three names to try</text><text x="884" y="148.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Provisional concepts; replace at any time.</text><rect x="884" y="176" width="64" height="64" rx="16" fill="rgb(221,245,160)" stroke="none" stroke-width="1" opacity="1"/><svg x="905" y="197" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-15a3 3 0 0 1 0 6m1 3c3 0 4 2 4 5"/></svg><text x="966" y="199.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Along</text><text x="966" y="228.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Two paths, one shared direction.</text><rect x="884" y="262" width="64" height="64" rx="16" fill="rgb(234,242,233)" stroke="none" stroke-width="1" opacity="1"/><svg x="905" y="283" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><text x="966" y="285.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Wayly</text><text x="966" y="314.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">A friendly way across the city.</text><rect x="884" y="348" width="64" height="64" rx="16" fill="rgb(234,242,233)" stroke="none" stroke-width="1" opacity="1"/><svg x="905" y="369" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-5-5 5 5-5 5"/></svg><text x="966" y="371.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Sameway</text><text x="966" y="400.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">A direct, destination-led name.</text><text x="884" y="449.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(20,107,89)">Selected direction: Along</text><text x="884" y="492.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Manrope typography, deep teal, warm whites, and a lime signal for an excellent match.</text><rect x="56" y="650" width="1448" height="126" rx="24" fill="rgb(234,242,233)" stroke="none" stroke-width="1" opacity="1"/><text x="80" y="692.3" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="rgb(18,60,56)">01 / Explore</text><text x="80" y="724.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Anonymous map, destination,</text><text x="80" y="746.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">public ride + group previews.</text><text x="550" y="692.3" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="rgb(18,60,56)">02 / Connect</text><text x="550" y="724.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Demo sign-in, search, join,</text><text x="550" y="746.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">meeting point + temporary chat.</text><text x="1020" y="692.3" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="rgb(18,60,56)">03 / Go together</text><text x="1020" y="724.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Coordinator readiness,</text><text x="1020" y="746.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Yandex Go handoff + closure.</text></svg>