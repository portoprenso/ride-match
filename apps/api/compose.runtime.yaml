# Local rehearsal of a deployable image, not an external production deployment.
name: ride-match-api-runtime
services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - runtime_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s
  api:
    image: ride-match-api:local
    env_file: .env.runtime.local
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
  migrate:
    image: ride-match-api:local
    profiles: [tools]
    env_file: .env.runtime.local
    command: [node, dist/database/migrate.js]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  runtime_postgres_data:
