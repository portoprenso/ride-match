<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>39 · Notifications permission</title><defs><clipPath id="clip1"><rect x="0" y="0" width="390" height="844" rx="32"/></clipPath></defs><g clip-path="url(#clip1)"><rect x="0" y="0" width="390" height="844" rx="32" fill="rgb(247,248,242)" stroke="none" stroke-width="1" opacity="1"/><text x="24" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">9:41</text><text x="300.6600036621094" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">▮▮▮  5G  ▰</text><rect x="135" y="827" width="120" height="4" rx="2" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><rect x="24" y="60" width="44" height="44" rx="16" fill="rgb(255,255,255)" stroke="none" stroke-width="1" opacity="1"/><svg x="35" y="71" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg><text x="80" y="87.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Stay in the loop</text><rect x="24" y="127" width="72" height="72" rx="16" fill="rgb(221,245,160)" stroke="none" stroke-width="1" opacity="1"/><svg x="49" y="152" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3h4"/></svg><text x="24" y="240.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Know when plans change.</text><text x="24" y="281.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Get a notification for a match, a group update,</text><text x="24" y="303.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">readiness, or a new message.</text><rect x="24" y="327" width="342" height="78" rx="12" fill="rgb(234,242,233)" stroke="none" stroke-width="1" opacity="1"/><text x="36" y="352.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(88,109,104)">Demo notifications are local to this device. Notification</text><text x="36" y="370.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(88,109,104)">previews won’t include private message text or exact</text><text x="36" y="388.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(88,109,104)">places.</text><rect x="24" y="679" width="342" height="52" rx="16" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><text x="123.74500274658203" y="710.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(255,255,255)">Enable notifications</text><text x="165.42499923706055" y="772.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Not now</text></g></svg>