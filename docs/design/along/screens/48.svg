<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>48 · Sign out</title><defs><clipPath id="clip1"><rect x="0" y="0" width="390" height="844" rx="32"/></clipPath></defs><g clip-path="url(#clip1)"><rect x="0" y="0" width="390" height="844" rx="32" fill="rgb(247,248,242)" stroke="none" stroke-width="1" opacity="1"/><text x="24" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">9:41</text><text x="300.6600036621094" y="29.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(18,60,56)">▮▮▮  5G  ▰</text><rect x="135" y="827" width="120" height="4" rx="2" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><rect x="24" y="60" width="44" height="44" rx="16" fill="rgb(255,255,255)" stroke="none" stroke-width="1" opacity="1"/><svg x="35" y="71" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg><text x="80" y="87.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Sign out</text><rect x="24" y="127" width="64" height="64" rx="16" fill="rgb(234,242,233)" stroke="none" stroke-width="1" opacity="1"/><svg x="45" y="148" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#123C38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H3v18h6m4-14 5 5-5 5m-6-5h15"/></svg><text x="24" y="232.4" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="rgb(18,60,56)">Sign out of this demo?</text><text x="24" y="273.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">Local private data and session credentials will be</text><text x="24" y="295.25" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="rgb(88,109,104)">cleared. Anonymous browsing remains available.</text><rect x="24" y="319" width="342" height="60" rx="12" fill="rgb(234,242,233)" stroke="none" stroke-width="1" opacity="1"/><text x="36" y="344.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(88,109,104)">Signing out is not the same as leaving a group or cancelling</text><text x="36" y="362.2" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="rgb(88,109,104)">a request. If needed, take those actions first.</text><rect x="24" y="679" width="342" height="52" rx="16" fill="rgb(18,60,56)" stroke="none" stroke-width="1" opacity="1"/><text x="165.0049991607666" y="710.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(255,255,255)">Sign out</text><text x="128.73500061035156" y="772.25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="rgb(18,60,56)">Keep me signed in</text></g></svg>